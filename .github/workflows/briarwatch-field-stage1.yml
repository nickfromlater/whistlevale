name: Briarwatch fieldcraft stage 1
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.github/workflows/briarwatch-field-stage1.yml']
permissions:
  contents: write
jobs:
  fieldcraft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply exact source and check stage one
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/briarwatch-castle'
          mkdir -p evidence/briarwatch-field
          python3 .briarwatch-field/apply.py stage1 | tee evidence/briarwatch-field/source-hashes.txt
          git diff --check
          npm run check > evidence/briarwatch-field/check.txt
          npm run test:briarwatch | tee evidence/briarwatch-field/focused.txt
      - name: Publish only stage one to this PR
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/briarwatch-castle | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rooms/briarwatch.js scripts/briarwatch-qa.mjs
          git rm .briarwatch-field/stage1.b64 .github/workflows/briarwatch-field-stage1.yml
          git commit -m 'Sculpt Briarwatch hero trees and localized woodland terrain'
          git push origin HEAD:refs/heads/codex/briarwatch-castle
          git rev-parse HEAD > evidence/briarwatch-field/source-commit.txt
          cp .briarwatch-field/capture.cjs evidence/briarwatch-field/capture.cjs
      - name: Native desktop and portrait review
        run: |
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 scripts/serve.py --port 4175 > evidence/briarwatch-field/server.txt 2>&1 &
          node .briarwatch-field/capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-field-stage1-views
          path: evidence/briarwatch-field/
          retention-days: 14
      - name: Complete regression suite
        run: |
          set -euo pipefail
          npm test > evidence/briarwatch-field/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/briarwatch-field/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/briarwatch-field/contributions.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-field-stage1-checks
          path: evidence/briarwatch-field/*.txt
          retention-days: 14
