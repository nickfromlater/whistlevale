name: Safari source transfer
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  source:
    if: github.head_ref == 'codex/safari-observatory'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: git archive --format=tar HEAD -o /tmp/safari-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: safari-redesign-source
          path: /tmp/safari-source.tar
          retention-days: 1
