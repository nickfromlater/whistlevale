name: Briarwatch atmosphere review
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.github/workflows/briarwatch-atmosphere-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install isolated review browser
        run: |
          mkdir -p evidence/briarwatch-atmosphere
          cp .briarwatch-atmosphere/capture.cjs /tmp/briarwatch-atmosphere-capture.cjs
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture matching baseline room views
        run: |
          python3 scripts/serve.py --port 4175 > evidence/briarwatch-atmosphere/server.txt 2>&1 &
          git rev-parse HEAD > evidence/briarwatch-atmosphere/baseline-commit.txt
          node /tmp/briarwatch-atmosphere-capture.cjs before
      - name: Verify exact source and focused regressions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/briarwatch-castle"
          python3 .briarwatch-atmosphere/apply.py | tee evidence/briarwatch-atmosphere/source-hashes.txt
          git diff --check
          npm run check | tee evidence/briarwatch-atmosphere/check.txt
          npm run test:briarwatch | tee evidence/briarwatch-atmosphere/focused.txt
          npm run test:glazing | tee evidence/briarwatch-atmosphere/glazing.txt
          npm run test:lighting | tee evidence/briarwatch-atmosphere/lighting.txt
      - name: Commit verified sources and remove one-use transfer
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/briarwatch-castle | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rooms/briarwatch.js src/railway.js scripts/briarwatch-qa.mjs docs/rooms/briarwatch.md
          git rm -r .briarwatch-atmosphere .github/workflows/briarwatch-atmosphere-review.yml
          git commit -m "Give Briarwatch estate outlooks and warm gallery lamplight"
          git push origin HEAD:refs/heads/codex/briarwatch-castle
          git rev-parse HEAD > evidence/briarwatch-atmosphere/source-commit.txt
      - name: Native browser review
        run: node /tmp/briarwatch-atmosphere-capture.cjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-atmosphere-views
          path: evidence/briarwatch-atmosphere/
          retention-days: 14
      - name: Full tests and geometry comparison
        run: |
          set -euo pipefail
          npm test > evidence/briarwatch-atmosphere/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/briarwatch-atmosphere/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/briarwatch-atmosphere/contributions.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-atmosphere-checks
          path: evidence/briarwatch-atmosphere/*.txt
          retention-days: 14
