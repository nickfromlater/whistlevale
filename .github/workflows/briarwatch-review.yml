name: Briarwatch native browser review
on:
  push:
    branches: [codex/briarwatch-castle]
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Apply verified refinements on the review branch only
        run: |
          test "$GITHUB_REF" = refs/heads/codex/briarwatch-castle
          if test -f .briarwatch-review/refine.0; then
            python3 - <<'PY'
          from pathlib import Path
          import base64,gzip,hashlib
          patch=gzip.decompress(base64.b64decode(''.join(p.read_text() for p in sorted(Path('.briarwatch-review').glob('refine.*'))),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='b92790e87dc53256402ea0d1865d89c127fb76af7ce1144db240e3589422eb68'
          Path('/tmp/refine.patch').write_bytes(patch)
          PY
            git apply --check /tmp/refine.patch
            git apply /tmp/refine.patch
            git rm .briarwatch-review/refine.*
            git add package.json src/rooms/briarwatch*.js scripts/briarwatch-qa.mjs docs/rooms/briarwatch.md
            git -c user.name='Nick' -c user.email='7002620+nickfromlater@users.noreply.github.com' commit -m 'Ground castle foundations, connect entrances and add Briarwatch regression tests'
            git push origin HEAD:refs/heads/codex/briarwatch-castle
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install isolated browser tooling
        run: |
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture native room with deterministic single-frame stepping
        run: |
          mkdir -p evidence/briarwatch
          python3 scripts/serve.py --port 4175 > evidence/briarwatch/server.log 2>&1 &
          node .briarwatch-review/capture.cjs
      - name: Full Node 24 checks
        if: always()
        run: |
          mkdir -p evidence/briarwatch
          set -o pipefail
          npm test 2>&1 | tee evidence/briarwatch/npm-test.log
          npm run test:geometry:full 2>&1 | tee evidence/briarwatch/geometry-full.log
          npm run check:contributions -- --json | tee evidence/briarwatch/contributions.json.log
      - name: Package reviewed source
        if: always()
        run: git archive --format=zip HEAD > evidence/briarwatch/whistlevale-source.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-native-browser-review
          path: evidence/briarwatch/
          retention-days: 14
