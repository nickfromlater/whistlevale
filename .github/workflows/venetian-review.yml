name: Venetian room review
on:
  push:
    branches: [codex/venetian-canal-room]
permissions:
  contents: write
jobs:
  apply-reviewed-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply the exact checked visual-review revision
        if: ${{ hashFiles('.venetian-review/polish') != '' }}
        run: |
          test "$GITHUB_REF" = refs/heads/codex/venetian-canal-room
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          source = root / '.venetian-review/polish'
          encoded = source.read_bytes()
          assert hashlib.sha256(encoded).hexdigest() == '7c883830fb564dae8b9a4a1faa22caec4a11ee796af60d017452e080984e0857', 'Transport hash mismatch'
          payload = json.loads(lzma.decompress(base64.b64decode(encoded)))
          allowed = {'docs/rooms/venetian.md', 'index.html', 'package.json', 'scripts/venetian-browser-qa.cjs', 'scripts/venetian-qa.mjs', 'src/hobby.js', 'src/rooms/venetian-architecture.js', 'src/rooms/venetian-life.js', 'src/rooms/venetian.js', 'src/shop-map.js'}
          assert set(payload['files']) == allowed, 'Unexpected path in patch'
          for name, hashes in payload['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == hashes['before'], 'Base hash mismatch: ' + name
          patch = pathlib.Path('/tmp/venetian-reviewed.patch')
          patch.write_text(payload['patch'])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          for name, hashes in payload['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == hashes['after'], 'Result hash mismatch: ' + name
          source.unlink()
          source.parent.rmdir()
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
          npm run check
          npm run test:venetian
          test "$(git ls-remote origin refs/heads/codex/venetian-canal-room | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/rooms/venetian.md index.html package.json scripts/venetian-browser-qa.cjs scripts/venetian-qa.mjs src/hobby.js src/rooms/venetian-architecture.js src/rooms/venetian-life.js src/rooms/venetian.js src/shop-map.js .venetian-review
          git commit -m 'Polish Venetian streets, rear facades, pedestrians and gallery lighting'
          git push origin HEAD:refs/heads/codex/venetian-canal-room
