name: Briarwatch fieldcraft stage 2 review
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.github/workflows/briarwatch-field-stage2.yml']
permissions:
  contents: read
jobs:
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify exact railway-detail revision
        run: |
          set -euo pipefail
          mkdir -p evidence/briarwatch-field
          git rev-parse HEAD > evidence/briarwatch-field/base-commit.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          assert hashlib.sha256(Path('.briarwatch-field/stage2.b64').read_text().strip().encode()).hexdigest() == 'ac1a6c4fda34080fd8b316be0d890ea8329129d0ae3d7c301b86b282e3bbee23'
          PY
          python3 .briarwatch-field/apply.py stage2 | tee evidence/briarwatch-field/source-hashes.txt
          git diff --check
          npm run check > evidence/briarwatch-field/check.txt
          npm run test:briarwatch > evidence/briarwatch-field/focused.txt
          zip -q evidence/briarwatch-field/revised-source.zip src/rooms/briarwatch.js src/rooms/briarwatch-village.js src/trains.js scripts/briarwatch-qa.mjs
          git diff > evidence/briarwatch-field/revision.patch
          cp .briarwatch-field/capture-stage2.cjs evidence/briarwatch-field/capture.cjs
      - name: Native railway, scenery, phone and room-switch review
        run: |
          set -euo pipefail
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 scripts/serve.py --port 4175 > evidence/briarwatch-field/server.txt 2>&1 &
          node .briarwatch-field/capture-stage2.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-field-stage2-native
          path: evidence/briarwatch-field/
          retention-days: 14
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Full Node 24 suite, all geometry and contributions
        run: |
          set -euo pipefail
          mkdir -p evidence/briarwatch-field
          git rev-parse HEAD > evidence/briarwatch-field/base-commit.txt
          python3 .briarwatch-field/apply.py stage2 | tee evidence/briarwatch-field/source-hashes.txt
          npm test > evidence/briarwatch-field/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/briarwatch-field/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/briarwatch-field/contributions.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-field-stage2-checks
          path: evidence/briarwatch-field/
          retention-days: 14
