name: Venetian craft and piazza review
on:
  push:
    branches: [codex/venetian-canal-room]
    paths: ['.venetian-finish', '.github/workflows/venetian-finish-review.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    outputs:
      source: ${{ steps.apply.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply only the exact locally tested finish
        id: apply
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/venetian-canal-room
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          source = root / '.venetian-finish'
          encoded = source.read_bytes()
          assert hashlib.sha256(encoded).hexdigest() == '9435b6b35fc8dad5e5150332446eda61b35f3bfa1af419b2db09abcd87b28bad', 'Transport hash mismatch'
          payload = json.loads(lzma.decompress(base64.b64decode(encoded)))
          allowed = {'docs/rooms/venetian.md', 'scripts/venetian-browser-qa.cjs', 'scripts/venetian-craft-qa.mjs', 'scripts/venetian-experience-qa.cjs', 'scripts/venetian-qa.mjs', 'src/railway.js', 'src/rooms/venetian-architecture.js', 'src/rooms/venetian-city.js', 'src/rooms/venetian.js'}
          assert set(payload['files']) == allowed, 'Unexpected path in patch'
          for name, hashes in payload['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == hashes['before'], 'Base changed: ' + name
          patch = pathlib.Path('/tmp/venetian-finish.patch')
          patch.write_text(payload['patch'])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          for name, hashes in payload['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == hashes['after'], 'Result hash mismatch: ' + name
          source.unlink()
          (root / '.github/workflows/venetian-finish-review.yml').unlink()
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
          npm run check
          npm run test:venetian
          test "$(git ls-remote origin refs/heads/codex/venetian-canal-room | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/rooms/venetian.md scripts/venetian-browser-qa.cjs scripts/venetian-craft-qa.mjs scripts/venetian-experience-qa.cjs scripts/venetian-qa.mjs src/railway.js src/rooms/venetian-architecture.js src/rooms/venetian-city.js src/rooms/venetian.js .venetian-finish .github/workflows/venetian-finish-review.yml
          git commit -m 'Give the Venetian campo a winged lion and finish masonry, paving and loggia depth'
          git push origin HEAD:refs/heads/codex/venetian-canal-room
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  views:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record source and native geometry
        run: |
          mkdir -p evidence/venetian
          git rev-parse HEAD > evidence/venetian/source-commit.txt
          set -o pipefail
          npm run test:venetian | tee evidence/venetian/focused.txt
      - name: Isolated review browser
        run: |
          npm install --prefix /tmp/whistlevale-browser playwright@1.55.1
          /tmp/whistlevale-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Native scene, reflection, cinema, portrait and house-map views
        run: |
          python3 scripts/serve.py --port 4175 > evidence/venetian/server.txt 2>&1 &
          node scripts/venetian-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venetian-finish-views
          path: evidence/venetian/
          retention-days: 14
  experience:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Isolated review browser
        run: |
          npm install --prefix /tmp/whistlevale-browser playwright@1.55.1
          /tmp/whistlevale-browser/node_modules/.bin/playwright install --with-deps chromium
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
      - name: Actual gestures, downloaded offline export and rendered rowing film
        env:
          VENETIAN_CAPTURE_FILM: '1'
        run: |
          mkdir -p evidence/venetian
          git rev-parse HEAD > evidence/venetian/source-commit.txt
          python3 scripts/serve.py --port 4175 > evidence/venetian/server.txt 2>&1 &
          node scripts/venetian-experience-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venetian-finish-experience
          path: evidence/venetian/
          retention-days: 14
  geometry:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Full suite, bitwise geometry and contribution report
        run: |
          mkdir -p evidence/venetian
          git rev-parse HEAD > evidence/venetian/source-commit.txt
          npm test > evidence/venetian/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/venetian/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/venetian/contributions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venetian-finish-checks
          path: evidence/venetian/*.txt
          retention-days: 14
