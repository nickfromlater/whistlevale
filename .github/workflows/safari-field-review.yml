name: Safari field lodge review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  review:
    if: github.head_ref == 'codex/safari-observatory' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Integrate the user-requested field lodge on the feature branch only
        run: |
          set -euo pipefail
          if test -f .github/safari-field-update.py; then
            python3 .github/safari-field-update.py
            git rm .github/safari-field-functions.js .github/safari-field-update.py
            git add src/rooms/safari.js src/rooms/safari-lodge.js scripts/safari-qa.mjs scripts/safari-lodge-visual.mjs scripts/safari-visual-review.mjs docs/rooms/safari.md
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Remove pool and rear porch; rebuild Kopje as a safari field lodge'
            git push origin HEAD:refs/heads/codex/safari-observatory
          fi
          mkdir -p evidence/safari-field
          git rev-parse HEAD > evidence/safari-field/reviewed-commit.txt
          sha256sum src/rooms/safari.js src/rooms/safari-lodge.js scripts/safari-qa.mjs > evidence/safari-field/source-hashes.txt
      - name: Install a reviewer-owned browser outside the project
        run: |
          npm install --prefix /tmp/whistlevale-browser playwright@1.55.1
          /tmp/whistlevale-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Inspect the field lodge and reclaimed ground in native WebGL
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/whistlevale-browser/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          python3 scripts/serve.py --port 4175 > evidence/safari-field/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/safari-lodge-visual.mjs 2>&1 | tee evidence/safari-field/native-run.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-field-lodge-native-art
          path: |
            evidence/safari-lodge/*.png
            evidence/safari-lodge/*.json
            evidence/safari-field/*.txt
          retention-days: 7
      - name: Validate complete integration and playable export
        if: always()
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/whistlevale-browser/node_modules/playwright/index.mjs
        run: |
          set +e
          node scripts/safari-visual-review.mjs > evidence/safari-field/integration-run.txt 2>&1
          browser_status=$?
          npm test > evidence/safari-field/npm-test.txt 2>&1
          test_status=$?
          npm run test:geometry:full > evidence/safari-field/geometry-full.txt 2>&1
          geometry_status=$?
          npm run --silent check:contributions -- --json > evidence/safari-field/contributions.json 2>&1
          contribution_status=$?
          printf '{"browserIntegration":%s,"npmTest":%s,"geometryFull":%s,"contributions":%s}\n' "$browser_status" "$test_status" "$geometry_status" "$contribution_status" > evidence/safari-field/test-statuses.json
          cat evidence/safari-field/test-statuses.json
          tail -30 evidence/safari-field/npm-test.txt
          test "$browser_status" -eq 0 && test "$test_status" -eq 0 && test "$geometry_status" -eq 0 && test "$contribution_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-field-lodge-checks
          path: |
            evidence/safari-field/
            evidence/safari/browser-review.json
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-field-lodge-playable
          path: evidence/safari/whistlevale-safari-review.html
          if-no-files-found: ignore
          retention-days: 7
