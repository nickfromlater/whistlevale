name: Meridian candidate verification
on:
  pull_request:
    paths:
      - '.github/workflows/meridian-review.yml'
      - 'scripts/meridian-review-*'
permissions:
  contents: read
jobs:
  candidate:
    if: github.event.pull_request.number == 25 && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'contrib/meridian-celestial-theatre'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply only the locally reviewed, hash-pinned candidate
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/meridian-review-{0,1,2}.patch > /tmp/meridian-candidate.patch
          python3 - <<'PY'
          import json, subprocess
          expected=json.load(open('scripts/meridian-review-expected.json'))
          numstat=subprocess.check_output(['git','apply','--numstat','/tmp/meridian-candidate.patch'],text=True)
          paths=[line.split('\t',2)[2] for line in numstat.strip().splitlines()]
          assert len(paths)==13 and set(paths)==set(expected), 'Unexpected candidate paths'
          subprocess.run(['git','apply','--check','/tmp/meridian-candidate.patch'],check=True)
          subprocess.run(['git','apply','/tmp/meridian-candidate.patch'],check=True)
          for path, sha in expected.items():
              actual=subprocess.check_output(['git','hash-object',path],text=True).strip()
              assert actual==sha, (path,actual,sha)
              print(path, actual)
          PY
          git diff --check
      - name: Run complete Node 24 and geometry checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/celestial-ci
          npm test 2>&1 | tee evidence/celestial-ci/npm-test.log
          npm run test:geometry:full 2>&1 | tee evidence/celestial-ci/geometry-full.log
          node scripts/community-check.mjs --json > evidence/celestial-ci/contributions.json
      - name: Store verified source blobs without updating any ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import {readFile,writeFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          const expected=JSON.parse(await readFile('scripts/meridian-review-expected.json','utf8'));
          const receipt={};
          for(const [path,sha] of Object.entries(expected)){
            const content=await readFile(path,'utf8');
            const bytes=Buffer.from(content);
            const actual=createHash('sha1').update(Buffer.from('blob '+bytes.length+'\0')).update(bytes).digest('hex');
            if(actual!==sha)throw Error('Candidate changed after review: '+path);
            const response=await fetch('https://api.github.com/repos/nickfromlater/whistlevale/git/blobs',{
              method:'POST',headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              body:JSON.stringify({content,encoding:'utf-8'}),signal:AbortSignal.timeout(30000)
            });
            if(!response.ok)throw Error('Blob creation failed '+path+': HTTP '+response.status);
            const result=await response.json();
            if(result.sha!==sha)throw Error('GitHub blob identity mismatch: '+path);
            receipt[path]=result.sha;console.log(path+' '+result.sha);
          }
          await writeFile('evidence/celestial-ci/source-blobs.json',JSON.stringify(receipt,null,2));
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: meridian-celestial-verification
          path: evidence/celestial-ci/
          retention-days: 3
