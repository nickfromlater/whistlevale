name: Briarwatch scenery review
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.github/workflows/briarwatch-scenery-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Verify complete transfer and focused regressions
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/briarwatch-castle"
          mkdir -p evidence/briarwatch-scenery
          python3 - <<'PY'
          import hashlib, json, pathlib
          # A repeated base64 span was caught by the source checksums. Repair
          # only that exact transfer; the reviewed source hashes are unchanged.
          path = pathlib.Path('.briarwatch-scenery-review/structure.json')
          payload = json.loads(path.read_text())
          entry = payload['src/rooms/briarwatch-village.js']
          data = entry['data']
          assert hashlib.sha256(data.encode()).hexdigest() == '7b2fc73ff18ea1f58c90e069dd8ac1396ea27298ff2fc757ca169e8250f112e7'
          entry['data'] = data[:80] + data[112:]
          path.write_text(json.dumps(payload))
          PY
          cp .briarwatch-scenery-review/*.json evidence/briarwatch-scenery/
          python3 .briarwatch-scenery-review/apply.py | tee evidence/briarwatch-scenery/source-hashes.txt
          git diff --check
          npm run check | tee evidence/briarwatch-scenery/check.txt
          npm run test:briarwatch | tee evidence/briarwatch-scenery/focused.txt
      - name: Commit only verified room changes and remove this one-use transfer
        run: |
          set -euo pipefail
          cp .briarwatch-scenery-review/capture.cjs /tmp/briarwatch-scenery-capture.cjs
          test "$(git ls-remote origin refs/heads/codex/briarwatch-castle | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/rooms/briarwatch.md scripts/briarwatch-qa.mjs src/rooms/briarwatch.js src/rooms/briarwatch-castle.js src/rooms/briarwatch-village.js
          git rm -rf .briarwatch-scenery-review .github/workflows/briarwatch-scenery-review.yml
          git commit -m "Sculpt Briarwatch's wooded ravines, castle masonry and spring landscape"
          git push origin HEAD:refs/heads/codex/briarwatch-castle
          git rev-parse HEAD > evidence/briarwatch-scenery/source-commit.txt
          rm evidence/briarwatch-scenery/structure.json evidence/briarwatch-scenery/landscape.json
      - name: Install isolated review browser
        run: |
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture actual native room and portrait views
        run: |
          python3 scripts/serve.py --port 4175 > evidence/briarwatch-scenery/server.txt 2>&1 &
          node /tmp/briarwatch-scenery-capture.cjs
      - name: Full Node 24 suite, complete geometry and contribution audit
        run: |
          set -euo pipefail
          npm test > evidence/briarwatch-scenery/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/briarwatch-scenery/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/briarwatch-scenery/contributions.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-scenery-native-review
          path: evidence/briarwatch-scenery/
          retention-days: 14
