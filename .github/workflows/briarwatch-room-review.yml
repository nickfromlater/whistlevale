name: Briarwatch room review
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.github/workflows/briarwatch-room-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with: {ref: '${{ github.sha }}'}
      - uses: actions/setup-node@v7
        with: {node-version: 24}
      - name: Apply gallery revision and verify
        run: |
          set -euo pipefail
          python3 .briarwatch-room-review/apply.py
          git diff --check
          npm run check
          npm run test:briarwatch
      - name: Commit reviewed room source and remove transfer
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/codex/briarwatch-castle | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rooms/briarwatch.js
          git rm -rf .briarwatch-room-review .github/workflows/briarwatch-room-review.yml
          git commit -m "Turn Briarwatch's shell into an authored estate railway gallery"
          git push origin HEAD:refs/heads/codex/briarwatch-castle
      - name: Full suite
        run: |
          npm test
          npm run test:geometry:full
          npm run check:contributions -- --json
