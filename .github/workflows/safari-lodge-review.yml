name: Safari lodge native review
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  review:
    if: github.head_ref == 'codex/safari-observatory' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fit the hipped roof frames on the feature branch
        run: |
          set -euo pipefail
          if test -f .github/safari-roof.patch; then
            git apply --check .github/safari-roof.patch
            git apply .github/safari-roof.patch
            git rm .github/safari-roof.patch
            git add src/rooms/safari-lodge.js
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Fit lodge posts and trusses to the actual hipped roofs'
            git push origin HEAD:refs/heads/codex/safari-observatory
          fi
          mkdir -p evidence/safari-lodge
          git rev-parse HEAD > evidence/safari-lodge/reviewed-commit.txt
          git ls-tree -r HEAD > evidence/safari-lodge/reviewed-tree.txt
      - name: Install an isolated review browser
        run: |
          npm install --prefix /tmp/whistlevale-browser playwright@1.55.1
          /tmp/whistlevale-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Inspect the lodge and landscape in native WebGL
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/whistlevale-browser/node_modules/playwright/index.mjs
        run: |
          set -euo pipefail
          python3 scripts/serve.py --port 4175 > evidence/safari-lodge/server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4175/ -o /dev/null; then break; fi
            sleep 1
          done
          node scripts/safari-lodge-visual.mjs 2>&1 | tee evidence/safari-lodge/browser-run.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kopje-house-native-art
          path: evidence/safari-lodge/
          retention-days: 7
      - name: Validate the final geometry and application
        if: always()
        run: |
          set +e
          mkdir -p evidence/safari-lodge
          npm test > evidence/safari-lodge/npm-test.txt 2>&1
          test_status=$?
          npm run test:geometry:full > evidence/safari-lodge/geometry-full.txt 2>&1
          geometry_status=$?
          npm run --silent check:contributions -- --json > evidence/safari-lodge/contributions.json 2>&1
          contributions_status=$?
          printf '{"npmTest":%s,"geometryFull":%s,"contributions":%s}\n' "$test_status" "$geometry_status" "$contributions_status" > evidence/safari-lodge/test-statuses.json
          cat evidence/safari-lodge/test-statuses.json
          tail -30 evidence/safari-lodge/npm-test.txt
          test "$test_status" -eq 0 && test "$geometry_status" -eq 0 && test "$contributions_status" -eq 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kopje-house-automated-checks
          path: |
            evidence/safari-lodge/*.txt
            evidence/safari-lodge/contributions.json
            evidence/safari-lodge/test-statuses.json
          retention-days: 7
