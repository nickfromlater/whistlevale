name: Publish reviewed Briarwatch Lantern Gallery
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.github/workflows/briarwatch-lantern-publish.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Require the exact native review and full checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/briarwatch-castle'
          mkdir -p evidence/briarwatch-lantern-publish
          for attempt in $(seq 1 27); do
            gh api repos/nickfromlater/whistlevale/actions/runs/35280538446 > /tmp/lantern-run.json
            test "$(jq -r '.head_sha' /tmp/lantern-run.json)" = 'ab693533b0646539d9417f780c289d96a7bbbed3'
            state="$(jq -r '.status+":"+(.conclusion//"")' /tmp/lantern-run.json)"
            echo "$state"
            case "$state" in
              completed:success) break ;;
              completed:*) echo 'Review did not pass; no runtime changes will be published'; exit 1 ;;
            esac
            sleep 20
          done
          test "$state" = 'completed:success'
          jq '{id,head_sha,status,conclusion,html_url}' /tmp/lantern-run.json > evidence/briarwatch-lantern-publish/review.json
      - name: Reproduce the exact verified source
        run: |
          set -euo pipefail
          python3 .briarwatch-lantern/apply.py
          python3 .briarwatch-lantern/finish.py
          python3 .briarwatch-lantern/comfort.py | tee evidence/briarwatch-lantern-publish/source-hashes.txt
          git diff --check
          npm run check > evidence/briarwatch-lantern-publish/check.txt
          npm run test:briarwatch > evidence/briarwatch-lantern-publish/focused.txt
      - name: Fast-forward only this PR branch and remove staging
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin refs/heads/codex/briarwatch-castle | cut -f1)"
          echo "Expected head $GITHUB_SHA; current head $actual"
          test "$actual" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rooms/briarwatch.js src/railway.js scripts/briarwatch-qa.mjs
          git rm .briarwatch-lantern/apply.py .briarwatch-lantern/revision.b64 .briarwatch-lantern/capture.cjs .briarwatch-lantern/finish.py .briarwatch-lantern/comfort.py .github/workflows/briarwatch-lantern-review.yml .github/workflows/briarwatch-lantern-publish.yml
          git diff --cached --check
          git commit -m 'Elevate Briarwatch into the Lantern Gallery with clock, coves, parquet and upholstered benches'
          git push origin HEAD:refs/heads/codex/briarwatch-castle
          git rev-parse HEAD > evidence/briarwatch-lantern-publish/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-lantern-published-source
          path: evidence/briarwatch-lantern-publish/
          retention-days: 14
