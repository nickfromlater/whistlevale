name: Safari shadow precision diagnosis
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  review:
    if: github.head_ref == 'codex/safari-observatory' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Isolated reviewer browser
        run: |
          npm install --prefix /tmp/whistlevale-browser playwright@1.55.1
          /tmp/whistlevale-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Same-camera precision and shadow comparison
        run: |
          python3 scripts/serve.py --port 4175 > /tmp/safari-server.log 2>&1 &
          sleep 2
          node .github/safari-shadow-diagnostic.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-shadow-diagnosis
          path: evidence/safari-shadow/
          retention-days: 7
