name: Briarwatch estate audit
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.github/workflows/briarwatch-estate-audit.yml']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record source and verify bounded revision
        run: |
          set -euo pipefail
          mkdir -p evidence/briarwatch-atmosphere
          git archive HEAD --format=zip -o evidence/briarwatch-atmosphere/source-before.zip
          git rev-parse HEAD > evidence/briarwatch-atmosphere/source-before.txt
          cp .briarwatch-atmosphere/capture.cjs evidence/briarwatch-atmosphere/capture.cjs
          python3 .briarwatch-atmosphere/apply.py | tee evidence/briarwatch-atmosphere/source-hashes.txt
          git diff --check
          git diff > evidence/briarwatch-atmosphere/revision.patch
          zip -q evidence/briarwatch-atmosphere/revised-source.zip src/rooms/briarwatch.js src/railway.js scripts/briarwatch-qa.mjs docs/rooms/briarwatch.md
          npm run check | tee evidence/briarwatch-atmosphere/check.txt
          npm run test:briarwatch | tee evidence/briarwatch-atmosphere/focused.txt
          npm run test:glazing | tee evidence/briarwatch-atmosphere/glazing.txt
          npm run test:lighting | tee evidence/briarwatch-atmosphere/lighting.txt
      - name: Native browser capture
        run: |
          set -euo pipefail
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 scripts/serve.py --port 4175 > evidence/briarwatch-atmosphere/server.txt 2>&1 &
          node .briarwatch-atmosphere/capture.cjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-estate-audit-views
          path: evidence/briarwatch-atmosphere/
          retention-days: 7
      - name: Full suite and complete geometry comparison
        run: |
          set -euo pipefail
          npm test > evidence/briarwatch-atmosphere/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/briarwatch-atmosphere/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/briarwatch-atmosphere/contributions.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-estate-audit-checks
          path: evidence/briarwatch-atmosphere/*.txt
          retention-days: 7
