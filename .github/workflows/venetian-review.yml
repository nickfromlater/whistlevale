name: Venetian room review
on:
  push:
    branches: [codex/venetian-canal-room]
permissions:
  contents: read
concurrency:
  group: venetian-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Snapshot tracked source for isolated review
        run: git archive --format=tar.gz --output=/tmp/whistlevale-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: venetian-source
          path: /tmp/whistlevale-source.tar.gz
          retention-days: 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Native checks
        if: ${{ hashFiles('src/rooms/venetian.js') != '' }}
        run: |
          mkdir -p evidence/venetian
          set -o pipefail
          npm test 2>&1 | tee evidence/venetian/npm-test.txt
          npm run test:geometry:full 2>&1 | tee evidence/venetian/geometry-full.txt
          npm run check:contributions -- --json > evidence/venetian/contributions.txt
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('src/rooms/venetian.js') != '' }}
        with:
          name: venetian-checks
          path: evidence/venetian/
          retention-days: 7
