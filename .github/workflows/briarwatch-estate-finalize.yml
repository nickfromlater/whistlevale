name: Briarwatch estate final review
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.github/workflows/briarwatch-estate-finalize.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply hash-verified revision and visual-review corrections
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/codex/briarwatch-castle"
          mkdir -p evidence/briarwatch-atmosphere
          python3 .briarwatch-atmosphere/apply.py | tee evidence/briarwatch-atmosphere/initial-source-hashes.txt
          python3 .briarwatch-atmosphere/refine.py | tee evidence/briarwatch-atmosphere/source-hashes.txt
          git diff --check
          npm run check | tee evidence/briarwatch-atmosphere/check.txt
          npm run test:briarwatch | tee evidence/briarwatch-atmosphere/focused.txt
          npm run test:glazing | tee evidence/briarwatch-atmosphere/glazing.txt
          npm run test:lighting | tee evidence/briarwatch-atmosphere/lighting.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.briarwatch-atmosphere/capture.cjs')
          s=p.read_text()
          needle="await page.evaluate(async()=>{await openHouseMap();});await shot('15-live-house-map');"
          assert needle in s
          s=s.replace(needle,needle+"\n   await page.evaluate(()=>closeHouseMap());\n   await page.evaluate(()=>HOBBY_HOUSE.visit('coast'));await page.waitForFunction(()=>HOBBY_HOUSE.state.room==='coast'&&!hobby.transition);await page.evaluate(()=>{setMood('evening',{immediate:true});setView('room',false);});await shot('16-coast-regression');\n   await page.evaluate(()=>HOBBY_HOUSE.visit('briarwatch'));await page.waitForFunction(()=>HOBBY_HOUSE.state.room==='briarwatch'&&!hobby.transition);await page.evaluate(()=>{setMood('evening',{immediate:true});setView('room',false);});await shot('17-briarwatch-return');")
          Path('/tmp/briarwatch-estate-final.cjs').write_text(s)
          Path('evidence/briarwatch-atmosphere/capture.cjs').write_text(s)
          d=Path('docs/rooms/briarwatch.md')
          d.write_text(d.read_text()+"\nThe native visual review caught exposed sky above the window arches. Solid\ntop and upper side returns now seal the casings, with high-angle intersection\nregressions. Exterior broadleaf trees reuse the miniature's tapered branches\nand asymmetric leaf clouds. Pendants now hang below connected beam outriggers;\ntheir native light positions match the lowered fixtures.\n")
          PY
      - name: Commit only this revision and remove owned transfer files
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin refs/heads/codex/briarwatch-castle | cut -f1)"
          echo "Expected head: $GITHUB_SHA; current head: $actual"
          test "$actual" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rooms/briarwatch.js src/railway.js scripts/briarwatch-qa.mjs docs/rooms/briarwatch.md
          git rm -r .briarwatch-atmosphere .github/workflows/briarwatch-estate-audit.yml .github/workflows/briarwatch-estate-finalize.yml
          if test "$(git rev-parse HEAD:.github/workflows/briarwatch-atmosphere-review.yml)" = '3d6ef8e763651f3691ced00eb6303682cd3858c6'; then
            git rm .github/workflows/briarwatch-atmosphere-review.yml
          fi
          git commit -m "Finish Briarwatch estate outlooks and warm gallery atmosphere"
          git push origin HEAD:refs/heads/codex/briarwatch-castle
          git rev-parse HEAD > evidence/briarwatch-atmosphere/source-commit.txt
          zip -q evidence/briarwatch-atmosphere/revised-source.zip src/rooms/briarwatch.js src/railway.js scripts/briarwatch-qa.mjs docs/rooms/briarwatch.md
      - name: Native visual, dimmer, map and room-switch review
        run: |
          set -euo pipefail
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 scripts/serve.py --port 4175 > evidence/briarwatch-atmosphere/server.txt 2>&1 &
          node /tmp/briarwatch-estate-final.cjs after
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-estate-final-views
          path: evidence/briarwatch-atmosphere/
          retention-days: 14
      - name: Full suite, all geometry and contribution audit
        run: |
          set -euo pipefail
          npm test > evidence/briarwatch-atmosphere/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/briarwatch-atmosphere/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/briarwatch-atmosphere/contributions.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-estate-final-checks
          path: evidence/briarwatch-atmosphere/*.txt
          retention-days: 14
