name: Venetian final visual correction
on:
  push:
    branches: [codex/venetian-canal-room]
    paths: ['.venetian-final/**', '.github/workflows/venetian-final.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.apply.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply the exact tested final visual correction
        id: apply
        run: |
          test "$GITHUB_REF" = refs/heads/codex/venetian-canal-room
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          transport = root / '.venetian-final/source.b64'
          encoded = transport.read_bytes()
          assert hashlib.sha256(encoded).hexdigest() == 'b10f0b255ba5530cac5ed7e7c43dd82a32424ebb3d82204de14f0037030c60f6', 'Transport mismatch'
          payload = json.loads(lzma.decompress(base64.b64decode(encoded)))
          allowed = {'scripts/venetian-browser-qa.cjs', 'scripts/venetian-qa.mjs', 'src/rooms/venetian-architecture.js', 'src/rooms/venetian-life.js', 'src/rooms/venetian.js'}
          assert set(payload['files']) == allowed, 'Unexpected file set'
          for name, hashes in payload['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == hashes['before'], 'Source conflict: ' + name
          patch = pathlib.Path('/tmp/venetian-final.patch')
          patch.write_text(payload['patch'])
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch)], check=True)
          for name, hashes in payload['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == hashes['after'], 'Result mismatch: ' + name
          transport.unlink()
          transport.parent.rmdir()
          (root / '.github/workflows/venetian-final.yml').unlink()
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
          npm run check
          npm run test:venetian
          test "$(git ls-remote origin refs/heads/codex/venetian-canal-room | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/venetian-browser-qa.cjs scripts/venetian-qa.mjs src/rooms/venetian-architecture.js src/rooms/venetian-life.js src/rooms/venetian.js .venetian-final .github/workflows/venetian-final.yml
          git commit -m 'Finish Venetian streets, frame the open loggia and guide the gondola camera through basin turns'
          git push origin HEAD:refs/heads/codex/venetian-canal-room
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  views:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record source and check native geometry
        run: |
          mkdir -p evidence/venetian
          git rev-parse HEAD > evidence/venetian/source-commit.txt
          set -o pipefail
          npm run test:venetian | tee evidence/venetian/focused.txt
      - name: Install isolated review browser
        run: |
          npm install --prefix /tmp/whistlevale-browser playwright@1.55.1
          /tmp/whistlevale-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Render the native room and exercise controls
        run: |
          python3 scripts/serve.py --port 4175 > evidence/venetian/server.txt 2>&1 &
          node scripts/venetian-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venetian-final-views
          path: evidence/venetian/
          retention-days: 14
  geometry:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.revision }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Full suite and byte-exact geometry
        run: |
          mkdir -p evidence/venetian
          git rev-parse HEAD > evidence/venetian/source-commit.txt
          npm test > evidence/venetian/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/venetian/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/venetian/contributions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venetian-final-checks
          path: evidence/venetian/*.txt
          retention-days: 14
