name: Venetian district and reflection review
on:
  push:
    branches: [codex/venetian-canal-room]
    paths: ['.venetian-craft/**', '.github/workflows/venetian-craft-review.yml']
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      source: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply the exact checked district and reflection revision
        id: source
        run: |
          test "$GITHUB_REF" = refs/heads/codex/venetian-canal-room
          test "$(git rev-parse HEAD^)" = 9806b593ec16f9f9e580fc7ac9fa67073fba9a80
          python3 - <<'PY'
          import base64, hashlib, json, lzma, pathlib, subprocess
          root = pathlib.Path.cwd()
          transport = root / '.venetian-craft/patch'
          encoded = transport.read_bytes()
          assert hashlib.sha256(encoded).hexdigest() == 'b531b5ebcbc0316e94ef84367b6ec9fcac0ae91755115f59850c9a40f790fee2', 'Transport hash mismatch'
          payload = json.loads(lzma.decompress(base64.b64decode(encoded)))
          allowed = {'index.html', 'package.json', 'scripts/venetian-browser-qa.cjs', 'scripts/venetian-craft-qa.mjs', 'scripts/venetian-qa.mjs', 'src/railway.js', 'src/rooms/venetian-architecture.js', 'src/rooms/venetian-city.js', 'src/rooms/venetian-render.js', 'src/rooms/venetian.js'}
          assert set(payload['files']) == allowed, 'Unexpected patch path'
          for name, hashes in payload['files'].items():
              p = root / name
              assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None) == hashes['before'], 'Base hash mismatch: ' + name
          patch = pathlib.Path('/tmp/venetian-craft.patch')
          patch.write_text(payload['patch'])
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', str(patch)], check=True)
          for name, hashes in payload['files'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == hashes['after'], 'Result hash mismatch: ' + name
          transport.unlink()
          transport.parent.rmdir()
          (root / '.github/workflows/venetian-craft-review.yml').unlink()
          subprocess.run(['git', 'diff', '--check'], check=True)
          PY
          npm run check
          npm run test:venetian
          test "$(git ls-remote origin refs/heads/codex/venetian-canal-room | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html package.json scripts/venetian-browser-qa.cjs scripts/venetian-craft-qa.mjs scripts/venetian-qa.mjs src/railway.js src/rooms/venetian-architecture.js src/rooms/venetian-city.js src/rooms/venetian-render.js src/rooms/venetian.js .venetian-craft .github/workflows/venetian-craft-review.yml
          git commit -m 'Build a connected Venetian district, pierced-stone palace, shop bridge and true canal reflections'
          git push origin HEAD:refs/heads/codex/venetian-canal-room
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  views:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Record source and geometry
        run: |
          mkdir -p evidence/venetian
          git rev-parse HEAD > evidence/venetian/source-commit.txt
          set -o pipefail
          npm run test:venetian | tee evidence/venetian/focused.txt
      - name: Isolated review browser
        run: |
          npm install --prefix /tmp/whistlevale-browser playwright@1.55.1
          /tmp/whistlevale-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Actual native room, reflection, cinema and map
        run: |
          python3 scripts/serve.py --port 4175 > evidence/venetian/server.txt 2>&1 &
          node scripts/venetian-browser-qa.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venetian-craft-views
          path: evidence/venetian/
          retention-days: 14
  checks:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.apply.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Full suite, full geometry and contribution report
        run: |
          mkdir -p evidence/venetian
          git rev-parse HEAD > evidence/venetian/source-commit.txt
          npm test > evidence/venetian/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/venetian/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/venetian/contributions.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: venetian-craft-checks
          path: evidence/venetian/
          retention-days: 14
