name: Briarwatch review workspace
on:
  push:
    branches: [codex/briarwatch-castle]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Package tracked public source for isolated local review
        run: git archive --format=zip HEAD > /tmp/whistlevale-source.zip
      - uses: actions/upload-artifact@v4
        with:
          name: briarwatch-review-source
          path: /tmp/whistlevale-source.zip
          retention-days: 1
