name: Finalize audited Briarwatch atmosphere
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.github/workflows/briarwatch-atmosphere-land.yml']
permissions:
  contents: write
  actions: read
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Require the corrected native revision to pass its full review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/briarwatch-castle'
          mkdir -p evidence/briarwatch-atmosphere-finalize
          for attempt in $(seq 1 40); do
            state=$(gh api repos/nickfromlater/whistlevale/actions/runs/35266785837 --jq '.status+":"+(.conclusion//"")')
            echo "$state"
            case "$state" in
              completed:success) break ;;
              completed:*) echo 'The corrected revision did not pass its full audit'; exit 1 ;;
            esac
            sleep 20
          done
          test "$state" = 'completed:success'
          gh api repos/nickfromlater/whistlevale/actions/runs/35266785837 --jq '{id,head_sha,status,conclusion,html_url}' > evidence/briarwatch-atmosphere-finalize/audit.json
      - name: Verify source identity without replacing any runtime code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
            'src/rooms/briarwatch.js': '2bee9234e9f57f528197129a67c0c225d46bc4041a714afbaf89f0cb7d4f7912',
            'src/railway.js': 'b0bfa3aa2ab1c14a96c1e15b52649a6bd1b73e15cbff69e80bd3cd3a03dd0813',
            'scripts/briarwatch-qa.mjs': '2e183807a187ef2b0aee16e4c189a31ed488fcad876f9041746e021906577e72'
          }
          for name, value in expected.items():
            assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == value, 'Source differs from corrected native review: ' + name
          Path('evidence/briarwatch-atmosphere-finalize/source-hashes.txt').write_text('\n'.join(value+' '+name for name,value in expected.items())+'\n')
          PY
      - name: Remove superseded staging from this PR only
        run: |
          set -euo pipefail
          actual="$(git ls-remote origin refs/heads/codex/briarwatch-castle | cut -f1)"
          echo "Expected head: $GITHUB_SHA; current head: $actual"
          test "$actual" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm --ignore-unmatch .briarwatch-atmosphere-review/apply.py .briarwatch-atmosphere-review/capture.cjs .briarwatch-atmosphere-review/revision.b64 .github/workflows/briarwatch-atmosphere-land.yml
          git diff --cached --check
          git commit -m 'Remove superseded atmosphere staging after final native audit'
          git push origin HEAD:refs/heads/codex/briarwatch-castle
          git rev-parse HEAD > evidence/briarwatch-atmosphere-finalize/source-commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-atmosphere-finalization
          path: evidence/briarwatch-atmosphere-finalize/
          retention-days: 14
