name: Briarwatch Lantern Gallery review
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.briarwatch-lantern/**', '.github/workflows/briarwatch-lantern-review.yml']
permissions:
  contents: read
concurrency:
  group: briarwatch-lantern-review
  cancel-in-progress: true
jobs:
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply and check exact bounded revision
        run: |
          set -euo pipefail
          mkdir -p evidence/briarwatch-lantern
          git rev-parse HEAD > evidence/briarwatch-lantern/base-commit.txt
          python3 .briarwatch-lantern/apply.py > evidence/briarwatch-lantern/initial-source-hashes.txt
          python3 .briarwatch-lantern/finish.py | tee evidence/briarwatch-lantern/source-hashes.txt
          git diff --check
          npm run check > evidence/briarwatch-lantern/source-check.txt
          npm run test:briarwatch > evidence/briarwatch-lantern/focused.txt
          npm run test:glazing > evidence/briarwatch-lantern/glazing.txt
          npm run test:lighting > evidence/briarwatch-lantern/lighting.txt
          zip -q evidence/briarwatch-lantern/revised-source.zip src/rooms/briarwatch.js src/railway.js scripts/briarwatch-qa.mjs
          python3 - <<'PY'
          from pathlib import Path
          s=Path('.briarwatch-lantern/capture.cjs').read_text()
          anchor='  for(const width of[390,320]){'
          assert s.count(anchor)==1
          s=s.replace(anchor,"  await camera([30,47,-60],26,.10,0);await shot('18-ceiling-cove');\n  await camera([24,-19.4,50],18,.48,-2.0);await shot('19-upholstered-bench');\n  await camera([0,32,-59],87,.10,.10);await shot('20-clock-and-cove');\n"+anchor,1)
          Path('evidence/briarwatch-lantern/capture.cjs').write_text(s)
          PY
      - name: Capture actual native room and interactions
        run: |
          set -euo pipefail
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 scripts/serve.py --port 4175 > evidence/briarwatch-lantern/server.txt 2>&1 &
          node evidence/briarwatch-lantern/capture.cjs
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('evidence/briarwatch-lantern/browser-report.json').read_text())
          assert len(r['views'])==21
          assert not r['errors'] and not r['console']
          assert all(v['glError']==0 for v in r['views'])
          print('21 native states without page, console or WebGL errors')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-lantern-finished-views
          path: evidence/briarwatch-lantern/
          retention-days: 14
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Full suite, geometry and contribution audit
        run: |
          set -euo pipefail
          mkdir -p evidence/briarwatch-lantern
          git rev-parse HEAD > evidence/briarwatch-lantern/base-commit.txt
          python3 .briarwatch-lantern/apply.py > evidence/briarwatch-lantern/initial-source-hashes.txt
          python3 .briarwatch-lantern/finish.py | tee evidence/briarwatch-lantern/source-hashes.txt
          npm test > evidence/briarwatch-lantern/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/briarwatch-lantern/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/briarwatch-lantern/contributions.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-lantern-finished-checks
          path: evidence/briarwatch-lantern/
          retention-days: 14
