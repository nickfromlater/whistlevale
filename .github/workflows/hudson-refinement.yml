name: Verify Hudson architecture refinement
on:
  push:
    branches: [contrib/hudson-terminal-acela]
    paths: ['.github/hudson-refinement/**', '.github/workflows/hudson-refinement.yml']
permissions:
  contents: read
concurrency:
  group: hudson-architecture-refinement
  cancel-in-progress: false
jobs:
  verify-and-commit:
    if: github.repository == 'nickfromlater/whistlevale' && github.ref == 'refs/heads/contrib/hudson-terminal-acela'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply only the four checksum-verified refinement files
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code f9c577b56d18c5731638d912b4814c5b6f4dbfec -- src/rooms/hudson.js src/trains/acela.js scripts/hudson-qa.mjs assets/trains/acela.webp
          mkdir -p /tmp/hudson-refinement-review
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, io, json, tarfile
          root=Path('.github/hudson-refinement')
          chunks=[root.joinpath(str(i)+'.b64').read_text() for i in range(4)]
          # Correct three known text-transport transcription errors, then verify
          # the canonical compressed bytes and every member before writing.
          chunks[0]=chunks[0].replace('G+vWurWKurWK1','G+vWurOurWK1').replace('kd5vrEWR9rYR','kd5vrE29rYR')
          chunks[2]=chunks[2].replace('+bhjTRXHid0fo','+bhTRXHid0fo')
          data=base64.b64decode(''.join(chunks),validate=True)
          assert hashlib.sha256(data).hexdigest()=='c9a640a2dc20f4a1eced65fc093ff1b26c06d78fafaa603f453e0b1b33b962d8'
          expected={
            'src/rooms/hudson.js':'c05ffc4c0545706f022822948b135969295ffb9548aa27f66856e249c52d7a26',
            'src/trains/acela.js':'69633020f061192d03fcc1923d644d5dfa39ae99eee83744b92af1c18201b360',
            'scripts/hudson-qa.mjs':'4e4558aa25a4b2baf62b458d9adf68688619f6ea65b8ebde40825a6ec6095911',
            'assets/trains/acela.webp':'15e1a6b87b31dfda834c377328e36965ea89be43d30e299713e506b00226bbc6'
          }
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
            members=archive.getmembers()
            assert len(members)==4 and {m.name for m in members}==set(expected)
            payload={}
            for member in members:
              assert member.isfile() and member.size<60000
              content=archive.extractfile(member).read()
              assert hashlib.sha256(content).hexdigest()==expected[member.name]
              payload[member.name]=content
            for name,content in payload.items():Path(name).write_bytes(content)
          Path('/tmp/hudson-refinement-review/source-checksums.json').write_text(json.dumps(expected,indent=2)+'\n')
          PY
          rm .github/hudson-refinement/{0,1,2,3}.b64
          rmdir .github/hudson-refinement
          rm .github/workflows/hudson-refinement.yml
      - name: Node 24 full suite, reference geometry and contribution checks
        shell: bash
        run: |
          set -euo pipefail
          node --version | tee /tmp/hudson-refinement-review/runtime.txt
          npm test 2>&1 | tee /tmp/hudson-refinement-review/npm-test.txt
          npm run test:geometry:full 2>&1 | tee /tmp/hudson-refinement-review/geometry-full.txt
          node scripts/community-check.mjs --json > /tmp/hudson-refinement-review/contributions.json
          node scripts/hudson-qa.mjs | tee /tmp/hudson-refinement-review/hudson-qa.txt
      - name: Commit the verified refinement to the contribution branch only
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/contrib/hudson-terminal-acela
          git add src/rooms/hudson.js src/trains/acela.js scripts/hudson-qa.mjs assets/trains/acela.webp
          git add -u .github/hudson-refinement .github/workflows/hudson-refinement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refine Hudson Terminal with glass vault, river bridge, rooftop city and sculpted Acela'
          git diff --quiet f9c577b56d18c5731638d912b4814c5b6f4dbfec HEAD -- .github vercel.json
          git diff f9c577b56d18c5731638d912b4814c5b6f4dbfec HEAD --stat | tee /tmp/hudson-refinement-review/change-summary.txt
          git rev-parse HEAD > /tmp/hudson-refinement-review/commit.txt
          git archive --format=zip --output=/tmp/hudson-refinement-review/hudson-terminal-v2-source.zip HEAD
          git push origin HEAD:refs/heads/contrib/hudson-terminal-acela
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hudson-refinement-review
          path: /tmp/hudson-refinement-review/
          retention-days: 14
