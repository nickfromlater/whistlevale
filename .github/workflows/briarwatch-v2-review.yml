name: Briarwatch v2 native review
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.briarwatch-v2/**', '.github/workflows/briarwatch-v2-review.yml']
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply only the fully hash-verified room revision
        run: |
          mkdir -p evidence/briarwatch-v2
          python3 .briarwatch-v2/apply.py | tee evidence/briarwatch-v2/source-hashes.txt
          npm run check
          npm run test:briarwatch | tee evidence/briarwatch-v2/focused.txt
          test "$(git ls-remote origin refs/heads/codex/briarwatch-castle | cut -f1)" = "$GITHUB_SHA"
          git config user.name nickfromlater
          git config user.email 7002620+nickfromlater@users.noreply.github.com
          git add docs/rooms/briarwatch.md scripts/briarwatch-qa.mjs src/hobby.js src/rooms/briarwatch.js src/rooms/briarwatch-castle.js src/rooms/briarwatch-village.js
          git diff --cached --quiet || git commit -m "Rebuild Briarwatch as a walk-in castle gallery with detailed architecture and a graded railway"
          git push origin HEAD:refs/heads/codex/briarwatch-castle
          git rev-parse HEAD > evidence/briarwatch-v2/source-commit.txt
      - name: Install isolated review browser
        run: |
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Capture actual native room views
        run: |
          python3 scripts/serve.py --port 4175 > evidence/briarwatch-v2/server.txt 2>&1 &
          node .briarwatch-v2/capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-v2-views
          path: evidence/briarwatch-v2/
          retention-days: 14
      - name: Full Node 24 checks and geometry comparison
        run: |
          npm test > evidence/briarwatch-v2/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/briarwatch-v2/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/briarwatch-v2/contributions.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-v2-checks
          path: evidence/briarwatch-v2/*.txt
          retention-days: 14
