name: Briarwatch Lantern Gallery review
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.briarwatch-lantern/**', '.github/workflows/briarwatch-lantern-review.yml']
permissions:
  contents: read
concurrency:
  group: briarwatch-lantern-review
  cancel-in-progress: true
jobs:
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Apply exact bounded revision
        run: |
          set -euo pipefail
          mkdir -p evidence/briarwatch-lantern
          git rev-parse HEAD > evidence/briarwatch-lantern/base-commit.txt
          python3 .briarwatch-lantern/apply.py | tee evidence/briarwatch-lantern/source-hashes.txt
          git diff --check
          npm run check > evidence/briarwatch-lantern/source-check.txt
          npm run test:briarwatch > evidence/briarwatch-lantern/focused.txt
          zip -q evidence/briarwatch-lantern/revised-source.zip src/rooms/briarwatch.js src/railway.js scripts/briarwatch-qa.mjs
          cp .briarwatch-lantern/capture.cjs evidence/briarwatch-lantern/
      - name: Capture actual native room and interactions
        run: |
          set -euo pipefail
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 scripts/serve.py --port 4175 > evidence/briarwatch-lantern/server.txt 2>&1 &
          node .briarwatch-lantern/capture.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-lantern-native-views
          path: evidence/briarwatch-lantern/
          retention-days: 14
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Full suite, geometry and contribution audit
        run: |
          set -euo pipefail
          mkdir -p evidence/briarwatch-lantern
          git rev-parse HEAD > evidence/briarwatch-lantern/base-commit.txt
          python3 .briarwatch-lantern/apply.py | tee evidence/briarwatch-lantern/source-hashes.txt
          npm test > evidence/briarwatch-lantern/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/briarwatch-lantern/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/briarwatch-lantern/contributions.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-lantern-native-checks
          path: evidence/briarwatch-lantern/
          retention-days: 14
