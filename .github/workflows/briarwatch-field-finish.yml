name: Briarwatch fieldcraft final
on:
  push:
    branches: [codex/briarwatch-castle]
    paths: ['.github/workflows/briarwatch-field-finish.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check exact transfers and complete regression suite
        run: |
          set -euo pipefail
          mkdir -p evidence/briarwatch-field-final
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          for name,digest in {'stage2':'ac1a6c4fda34080fd8b316be0d890ea8329129d0ae3d7c301b86b282e3bbee23','polish':'758fc96da7c4f1df4e546941120b7363d672c620a97ee3f020220baf2db9f9eb'}.items():
            assert hashlib.sha256(Path('.briarwatch-field/'+name+'.b64').read_text().strip().encode()).hexdigest()==digest,name
          PY
          python3 .briarwatch-field/apply.py stage2
          python3 .briarwatch-field/apply.py polish
          git diff --check
          sha256sum src/rooms/briarwatch.js src/rooms/briarwatch-village.js src/trains.js scripts/briarwatch-qa.mjs docs/rooms/briarwatch.md > evidence/briarwatch-field-final/source-hashes.txt
          git rev-parse HEAD > evidence/briarwatch-field-final/base-commit.txt
          npm test > evidence/briarwatch-field-final/npm-test.txt 2>&1
          npm run test:geometry:full > evidence/briarwatch-field-final/geometry-full.txt 2>&1
          npm run check:contributions -- --json > evidence/briarwatch-field-final/contributions.txt 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-field-final-checks
          path: evidence/briarwatch-field-final/
          retention-days: 14
  views:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Reproduce exact final source for native review
        run: |
          set -euo pipefail
          mkdir -p evidence/briarwatch-field
          git rev-parse HEAD > evidence/briarwatch-field/base-commit.txt
          python3 .briarwatch-field/apply.py stage2
          python3 .briarwatch-field/apply.py polish
          sha256sum src/rooms/briarwatch.js src/rooms/briarwatch-village.js src/trains.js scripts/briarwatch-qa.mjs docs/rooms/briarwatch.md > evidence/briarwatch-field/source-hashes.txt
          npm run test:briarwatch > evidence/briarwatch-field/focused.txt
          git diff > evidence/briarwatch-field/revision.patch
          zip -q evidence/briarwatch-field/revised-source.zip src/rooms/briarwatch.js src/rooms/briarwatch-village.js src/trains.js scripts/briarwatch-qa.mjs docs/rooms/briarwatch.md
          cp .briarwatch-field/capture-stage2.cjs evidence/briarwatch-field/capture.cjs
      - name: Capture final engine, terrain, station, phone and room states
        run: |
          set -euo pipefail
          npm install --prefix /tmp/briarwatch-browser playwright
          /tmp/briarwatch-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 scripts/serve.py --port 4175 > evidence/briarwatch-field/server.txt 2>&1 &
          node .briarwatch-field/capture-stage2.cjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('evidence/briarwatch-field/browser-report.json').read_text())
          assert len(r['views'])==21 and not r['errors'] and not r['console']
          assert all(v['glError']==0 for v in r['views'])
          assert r['selection']['stock']=='collection:cinder'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-field-final-native
          path: evidence/briarwatch-field/
          retention-days: 14
  publish:
    needs: [checks,views]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Publish only this verified stage and remove owned staging
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/codex/briarwatch-castle'
          python3 .briarwatch-field/apply.py stage2
          python3 .briarwatch-field/apply.py polish
          git diff --check
          test "$(git ls-remote origin refs/heads/codex/briarwatch-castle | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/rooms/briarwatch.js src/rooms/briarwatch-village.js src/trains.js scripts/briarwatch-qa.mjs docs/rooms/briarwatch.md
          git rm .briarwatch-field/apply.py .briarwatch-field/capture.cjs .briarwatch-field/capture-stage2.cjs .briarwatch-field/stage2.b64 .briarwatch-field/polish.b64 .github/workflows/briarwatch-field-stage2.yml .github/workflows/briarwatch-field-finish.yml
          git commit -m 'Finish Briarwatch estate train, grassed terrain and working railway details'
          git push origin HEAD:refs/heads/codex/briarwatch-castle
          mkdir -p evidence/briarwatch-field-published
          git rev-parse HEAD > evidence/briarwatch-field-published/source-commit.txt
          sha256sum src/rooms/briarwatch.js src/rooms/briarwatch-village.js src/trains.js scripts/briarwatch-qa.mjs docs/rooms/briarwatch.md > evidence/briarwatch-field-published/source-hashes.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: briarwatch-field-published-source
          path: evidence/briarwatch-field-published/
          retention-days: 14
